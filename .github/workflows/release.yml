name: release
# Publishes a GitHub Release whenever VERSION changes on main (or a v* tag is pushed).
on:
  push:
    branches: [main]
    paths: [VERSION, .github/workflows/release.yml]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="$(tr -d ' \n' < VERSION)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-go@v5
        if: steps.v.outputs.exists == 'false'
        with:
          go-version-file: go.mod
      - name: Build binaries
        if: steps.v.outputs.exists == 'false'
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath \
              -ldflags="-s -w -X main.version=${{ steps.v.outputs.version }}" -o fastdav .
            tar czf dist/fastdav_${{ steps.v.outputs.tag }}_linux_${arch}.tar.gz fastdav README.md
          done
          cp unraid/fastdav.xml dist/
          (cd dist && sha256sum * > SHA256SUMS)
      - name: Publish GitHub release
        if: steps.v.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" dist/* --target "$GITHUB_SHA" \
            --title "FastDAV ${{ steps.v.outputs.tag }}" --notes-file RELEASE_NOTES.md
      # Tags created with GITHUB_TOKEN don't trigger other workflows, so build the versioned image here.
      - uses: docker/setup-qemu-action@v3
        if: steps.v.outputs.exists == 'false'
      - uses: docker/setup-buildx-action@v3
        if: steps.v.outputs.exists == 'false'
      - uses: docker/login-action@v3
        if: steps.v.outputs.exists == 'false'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: steps.v.outputs.exists == 'false'
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fastdav:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/fastdav:latest
          build-args: VERSION=${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
